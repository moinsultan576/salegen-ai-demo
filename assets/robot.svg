<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440">
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e9efec"/><stop offset="1" stop-color="#b9c7c0"/></linearGradient>
    <linearGradient id="vz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14231d"/><stop offset="1" stop-color="#030806"/></linearGradient>
    <radialGradient id="eye"><stop offset="0" stop-color="#d9ffe6"/><stop offset=".35" stop-color="#5dfb95"/><stop offset="1" stop-color="#17b356"/></radialGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sd" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#sd)">
    <!-- waving arm (behind body) -->
    <path d="M232 262 Q270 236 284 196" stroke="url(#sh)" stroke-width="30" stroke-linecap="round" fill="none"/>
    <circle cx="232" cy="262" r="17" fill="#26352e"/>
    <circle cx="284" cy="194" r="13" fill="#26352e"/>
    <g transform="rotate(-12 292 160)"><rect x="272" y="128" width="40" height="46" rx="18" fill="url(#sh)"/><rect x="276" y="112" width="9" height="26" rx="4.5" fill="url(#sh)"/><rect x="287" y="106" width="9" height="30" rx="4.5" fill="url(#sh)"/><rect x="298" y="110" width="9" height="28" rx="4.5" fill="url(#sh)"/></g>
    <!-- other arm -->
    <path d="M90 266 Q66 300 70 352" stroke="url(#sh)" stroke-width="30" stroke-linecap="round" fill="none"/>
    <circle cx="90" cy="266" r="17" fill="#26352e"/>
    <circle cx="70" cy="360" r="20" fill="url(#sh)"/>
    <!-- body -->
    <path d="M100 252 Q160 232 222 252 L232 392 Q160 418 90 392 Z" fill="url(#sh)"/>
    <path d="M118 300 Q160 288 204 300" stroke="#cfdad4" stroke-width="3" fill="none"/>
    <circle cx="160" cy="330" r="17" fill="#0b1712"/>
    <circle cx="160" cy="330" r="10" fill="url(#eye)" filter="url(#gl)"/>
    <!-- neck -->
    <rect x="138" y="222" width="44" height="26" rx="8" fill="#1d2b25"/>
    <!-- head -->
    <ellipse cx="160" cy="132" rx="104" ry="100" fill="url(#sh)"/>
    <circle cx="58" cy="140" r="30" fill="url(#sh)" stroke="#c8d4ce" stroke-width="2"/><circle cx="58" cy="140" r="17" fill="none" stroke="#3ddc7e" stroke-width="5" filter="url(#gl)"/>
    <circle cx="262" cy="140" r="30" fill="url(#sh)" stroke="#c8d4ce" stroke-width="2"/><circle cx="262" cy="140" r="17" fill="none" stroke="#3ddc7e" stroke-width="5" filter="url(#gl)"/>
    <path d="M262 112 L262 60" stroke="#cfdad4" stroke-width="5" stroke-linecap="round"/><circle cx="262" cy="56" r="7" fill="#3ddc7e" filter="url(#gl)"/>
    <rect x="76" y="78" width="168" height="112" rx="54" fill="url(#vz)"/>
    <path d="M96 100 Q120 84 160 84" stroke="#fff" stroke-opacity=".18" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="124" cy="128" rx="20" ry="22" fill="url(#eye)" filter="url(#gl)"/>
    <ellipse cx="196" cy="128" rx="20" ry="22" fill="url(#eye)" filter="url(#gl)"/>
    <path d="M136 162 Q160 178 184 162" stroke="#5dfb95" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#gl)"/>
  </g>
</svg>
